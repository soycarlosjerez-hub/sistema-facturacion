# ============================================================================
# Erpipos ERP — Docker Compose for PRODUCTION
# ============================================================================
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
# ============================================================================

version: '3.8'

services:
  # ─── Nginx + SSL ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: erpipos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - erpipos
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── Certbot — SSL Certificates ──────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: erpipos-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap EXIT; exec tail -f /dev/null'"
    networks:
      - erpipos

  # ─── PHP-FPM ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_ENV=production
        - APP_DEBUG=false
    container_name: erpipos-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://${DOMAIN_NAME:-your-domain.com}
      - APP_LOCALE=es
      - APP_FAKER_LOCALE=es_ES
      - LOG_CHANNEL=stack
      - LOG_LEVEL=error
      - QUEUE_CONNECTION=database
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - SESSION_ENCRYPT=true
      - SESSION_LIFETIME=120
      - BCrypt_ROUNDS=12
    volumes:
      - .:/var/www/html
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - storage-data:/var/www/html/storage
    networks:
      - erpipos
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ─── MySQL ───────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: erpipos-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-erpipos}
      MYSQL_USER: ${DB_USERNAME:-erpipos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-strongpassword}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/mysql.cnf:/etc/mysql/conf.d/mysql.cnf:ro
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    ports:
      - "3306:3306"
    networks:
      - erpipos
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    command: >
      mysqld
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=1G
      --innodb-log-file-size=256M
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --log-error=/var/log/mysql/error.log
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --query-cache-type=0
      --tmp-table-size=64M
      --max-heap-table-size=64M
      --join-buffer-size=128M
      --sort-buffer-size=128M
      --read-buffer-size=128M
      --read-rnd-buffer-size=64M
      --thread-cache-size=8
      --table-open-cache=2000
      --open-files-limit=65535
      --wait-timeout=600
      --interactive-timeout=600
      --max-allowed-packet=64M
      --net-buffer-length=16384
      --net-read-timeout=60
      --net-write-timeout=60
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: erpipos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --hz 10
    volumes:
      - redis-data:/data
    networks:
      - erpipos
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ─── Queue Workers ──────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erpipos-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=5 --timeout=90 --memory=256 --sleep=3 --backoff=30
    environment:
      - QUEUE_CONNECTION=database
      - QUEUE_MAX_ATTEMPTS=5
      - QUEUE_RETRY_AFTER=90
    volumes:
      - .:/var/www/html
      - storage-data:/var/www/html/storage
    networks:
      - erpipos
    depends_on:
      - db
      - redis
      - app
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # ─── Schedule Worker ───────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erpipos-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - storage-data:/var/www/html/storage
    networks:
      - erpipos
    depends_on:
      - db
      - redis
      - app

  # ─── Telescope (solo en staging/development) ────────────────────────────
  telescope:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erpipos-telescope
    restart: unless-stopped
    environment:
      - TELESCOPE_ENABLED=true
      - APP_ENV=staging
    volumes:
      - .:/var/www/html
      - storage-data:/var/www/html/storage
    networks:
      - erpipos
    depends_on:
      - db
      - redis
      - app

  # ─── PHPMyAdmin (solo si necesitas acceso) ──────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: erpipos-phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - UPLOAD_LIMIT=100M
      - PMA_ARBITRARY=0
    ports:
      - "8080:80"
    networks:
      - erpipos
    depends_on:
      - db

networks:
  erpipos:
    driver: bridge
    name: erpipos-network

volumes:
  mysql-data:
    driver: local
    name: erpipos-mysql-data
  redis-data:
    driver: local
    name: erpipos-redis-data
  storage-data:
    driver: local
    name: erpipos-storage
  certbot-etc:
    driver: local
    name: erpipos-certbot-etc
  certbot-www:
    driver: local
    name: erpipos-certbot-www
