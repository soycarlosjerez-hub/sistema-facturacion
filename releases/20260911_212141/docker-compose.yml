version: '3.8'

services:
  # PHP-FPM Application Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erpipos-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - erpipos
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - db
      - redis

  # Nginx Web Server
  nginx:
    image: nginx:1.25-alpine
    container_name: erpipos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - erpipos
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: erpipos-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    ports:
      - "3306:3306"
    networks:
      - erpipos
    command: mysqld --default-authentication-plugin=caching_sha2_password --innodb-buffer-pool-size=1G --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Redis Cache/Queue
  redis:
    image: redis:7-alpine
    container_name: erpipos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - erpipos
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Database Admin (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: erpipos-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - UPLOAD_LIMIT=100M
    networks:
      - erpipos
    depends_on:
      - db

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erpipos-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
    networks:
      - erpipos
    depends_on:
      - db
      - redis
      - app

networks:
  erpipos:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
